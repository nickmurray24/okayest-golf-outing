name: Deploy Okayest Golf Outing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: okayest-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build React for project Pages URL
        env:
          CI: 'false'
          PUBLIC_URL: /${{ github.event.repository.name }}
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.REACT_APP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$REACT_APP_SUPABASE_URL" ] || [ -z "$REACT_APP_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Missing Supabase credentials. Add REACT_APP_SUPABASE_URL and REACT_APP_SUPABASE_PUBLISHABLE_KEY under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload build folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
